name: Buddy 每日自动化（签到 + 派猫 + 推送）

on:
  schedule:
    # 北京时间每天 06:00（GitHub cron 使用 UTC，需减 8 小时）
    - cron: '0 22 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发（验收用）

# 最小权限原则：本任务只需读写仓库自身内容与摘要产物
# （contents: write 用于保活提交，防止 GitHub 对长期无活动仓库停用 schedule）
permissions:
  contents: write

jobs:
  buddy-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 动态定位 Python 解释器（不硬编码版本号）
        id: py
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            echo "bin=python3" >> "$GITHUB_OUTPUT"
          elif command -v python >/dev/null 2>&1; then
            echo "bin=python" >> "$GITHUB_OUTPUT"
          else
            echo "::error::未找到 Python 解释器"
            exit 1
          fi
          "${{ steps.py.outputs.bin }}" --version

      - name: 执行签到 + 派猫 + 推送
        env:
          # —— 必填：WorkBuddy 登录态（由 GitHub Secrets 注入，绝不写入仓库）——
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
          WB_USER_ID: ${{ secrets.WB_USER_ID }}
          # —— 可选：企业/域名头 ——
          WB_ENTERPRISE_ID: ${{ secrets.WB_ENTERPRISE_ID }}
          WB_DOMAIN: ${{ secrets.WB_DOMAIN }}
          # —— 可选：派猫行为 ——
          TRAVEL_LOCATION_ID: ${{ secrets.TRAVEL_LOCATION_ID }}
          ADOPT_BUDDY: ${{ secrets.ADOPT_BUDDY }}
          # —— 可选：推送通道（至少配一个）——
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: ${{ steps.py.outputs.bin }} scripts/buddy_daily.py

      - name: 上传脱敏运行摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-run-summary
          path: artifacts/summary.json
          if-no-files-found: warn
          retention-days: 7

      # 保活提交：GitHub 会对 60 天无仓库活动的仓库自动停用 schedule 工作流。
      # 每次运行写一个日期戳并提交，保证仓库持续有活动，定时任务永不失联。
      # 说明：GITHUB_TOKEN 的推送不会触发新的 workflow 运行，无递归风险。
      - name: 保活提交（维持定时任务活跃）
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .github/LAST_RUN.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/LAST_RUN.txt
          if git diff --cached --quiet; then
            echo "无需提交（日期未变）"
          else
            git commit -m "chore: keep-alive $(date -u +%Y-%m-%d)"
            git push
          fi
